name: HRMS Worker checks
on:
  push:
    branches: [main, "feature/cloudflare-workers-migration"]
    paths:
      - "worker/**"
      - ".github/workflows/hrms-worker.yml"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/hrms-worker.yml"
  workflow_dispatch:

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm install
      - run: npm test
      - run: npm run typecheck
