name: HRMS Worker checks
on:
  push:
    branches: [main, "feature/cloudflare-workers-migration"]
    paths:
      - "worker/**"
      - ".github/workflows/hrms-worker.yml"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/hrms-worker.yml"
  workflow_dispatch:
    inputs:
      run_database_migrations:
        description: "Apply pending migrations to the dedicated HRMS test database only"
        required: true
        type: boolean
        default: false

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run check:migrations
      - run: npm run typecheck
      - name: Apply HRMS database migrations (manual opt-in only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_database_migrations == true }}
        env:
          HRMS_DATABASE_URL: ${{ secrets.HRMS_DATABASE_URL }}
        run: |
          if [ -z "$HRMS_DATABASE_URL" ]; then
            echo "::error::HRMS_DATABASE_URL repository secret is not configured."
            exit 1
          fi
          npm run migrate
